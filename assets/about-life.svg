<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="350" viewBox="0 0 1000 350" role="img"><defs><linearGradient id="about-line" x1="0" x2="1"><stop stop-color="#247bff"/><stop offset=".55" stop-color="#8a67ff"/><stop offset="1" stop-color="#ff354f"/></linearGradient><pattern id="about-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#7195d6" opacity=".18"/></pattern><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#f5f7fb} .muted{fill:#9aa9c3} .blue{fill:#8eb8ff} .chip{fill:#101d36;stroke:#263858;stroke-width:1} .small{font-size:13px} .label{font-size:12px;letter-spacing:2px;fill:#8eb8ff;font-weight:700} @media(prefers-reduced-motion:reduce){.anim{animation:none!important}}</style></defs><rect width="1000" height="350" rx="24" fill="#070b16"/><rect width="1000" height="350" rx="24" fill="url(#about-dots)"/><text x="36" y="45" class="label">ABOUT / APPROACH</text><text x="36" y="85" font-size="30" font-weight="800">Curious by nature. Builder by practice.</text><text x="36" y="119" font-size="15" class="muted">Learning through building, testing ideas, and improving with each project.</text><g><rect x="36" y="151" width="420" height="155" rx="18" fill="#0d1730" stroke="#263858"/><text x="58" y="184" font-size="18" font-weight="750">My approach</text><text x="58" y="213" font-size="14" class="muted">Strong fundamentals meet working software.</text><text x="58" y="237" font-size="14" class="muted">Exploring application development, AI tools,</text><text x="58" y="261" font-size="14" class="muted">and cloud technologies.</text><g font-size="13" font-weight="800"><text x="58" y="289" fill="#8eb8ff">01 BUILD</text><text x="185" y="289" fill="#8eb8ff">02 LEARN</text><text x="313" y="289" fill="#8eb8ff">03 IMPROVE</text></g></g><g><rect x="485" y="151" width="479" height="155" rx="18" fill="#0d1730" stroke="#263858"/><g opacity="1"><text x="513" y="185" class="label">SLIDE 01</text><text x="513" y="220" font-size="24" font-weight="800">Software engineering</text><text x="513" y="250" font-size="14" class="muted">Designing useful, reliable applications.</text><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;.28;.33;.61;.66;1" dur="12s" repeatCount="indefinite" begin="0s"/></g><g opacity="0"><text x="513" y="185" class="label">SLIDE 02</text><text x="513" y="220" font-size="24" font-weight="800">AI / ML exploration</text><text x="513" y="250" font-size="14" class="muted">Turning data and models into practical tools.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.28;.33;.61;.66;1" dur="12s" repeatCount="indefinite" begin="0s"/></g><g opacity="0"><text x="513" y="185" class="label">SLIDE 03</text><text x="513" y="220" font-size="24" font-weight="800">Cloud &amp; open source</text><text x="513" y="250" font-size="14" class="muted">Learning deployment and community workflows.</text><animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;.28;.33;.61;.66;1" dur="12s" repeatCount="indefinite" begin="0s"/></g></g><g transform="translate(513 278)"><rect width="128" height="4" rx="2" fill="#263858"/><rect width="128" height="4" rx="2" fill="#247bff"><animate attributeName="width" values="0;128;128;0" keyTimes="0;.3;.33;1" dur="4s" repeatCount="indefinite" begin="0s"/></rect><rect x="140" width="128" height="4" rx="2" fill="#263858"/><rect x="280" width="128" height="4" rx="2" fill="#263858"/></g></svg>