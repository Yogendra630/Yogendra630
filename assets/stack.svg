<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="420" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="stack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B16"/>
      <stop offset="100%" stop-color="#0B1226"/>
    </linearGradient>
    <linearGradient id="stack-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247BFF" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF354F" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="stack-center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#247BFF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#0A1021" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#070B16" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stack-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#247BFF" fill-opacity="0.12"/>
    </pattern>
    <filter id="stack-node-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes stack-orbit-1 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes stack-orbit-2 {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes stack-orbit-3 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes stack-pulse-core {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.06); opacity: 1; }
    }

    .stack-font { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .orbit-g-1 { transform-origin: 660px 115px; animation: stack-orbit-1 24s linear infinite; }
    .orbit-g-2 { transform-origin: 660px 115px; animation: stack-orbit-2 36s linear infinite; }
    .orbit-g-3 { transform-origin: 660px 115px; animation: stack-orbit-3 48s linear infinite; }
    .core-pulse { transform-origin: 660px 115px; animation: stack-pulse-core 4s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .orbit-g-1, .orbit-g-2, .orbit-g-3, .core-pulse { animation: none !important; }
    }
  </style>

  <!-- Base Frame -->
  <rect x="2" y="2" width="846" height="416" rx="16" fill="url(#stack-bg)" stroke="url(#stack-border)" stroke-width="1.5"/>
  <rect x="2" y="2" width="846" height="416" rx="16" fill="url(#stack-grid)"/>

  <!-- Left Header Section -->
  <g class="stack-font" transform="translate(44, 38)">
    <text x="0" y="0" fill="#247BFF" font-size="11" font-weight="700" letter-spacing="1.5">TECHNICAL ARSENAL</text>
    <text x="0" y="26" fill="#F5F7FB" font-size="22" font-weight="800" letter-spacing="-0.3">Technology Ecosystem</text>
    <text x="0" y="46" fill="#8E9BB5" font-size="12.5" font-weight="400">
      Categorized by proficiency: Core languages, backend architectures, AI &amp; cloud tooling.
    </text>
  </g>

  <!-- Right Visual: Tilted Planetary Orbital Rings -->
  <g>
    <!-- Core Ambient Glow -->
    <ellipse cx="660" cy="115" rx="120" ry="85" fill="url(#stack-center-glow)"/>

    <!-- Orbit 1: Inner (Backend & Languages) -->
    <ellipse cx="660" cy="115" rx="60" ry="38" stroke="#247BFF" stroke-width="1.2" stroke-dasharray="4 6" fill="none" opacity="0.6"/>
    <!-- Orbit 2: Middle (Web & Client) -->
    <ellipse cx="660" cy="115" rx="100" ry="60" stroke="#60A5FA" stroke-width="1.2" stroke-dasharray="6 8" fill="none" opacity="0.45"/>
    <!-- Orbit 3: Outer (AI, Cloud & Tools) -->
    <ellipse cx="660" cy="115" rx="140" ry="85" stroke="#FF354F" stroke-width="1.2" stroke-dasharray="8 10" fill="none" opacity="0.4"/>

    <!-- Revolving Satellites -->
    <!-- Orbit 1 Satellites -->
    <g class="orbit-g-1">
      <circle cx="720" cy="115" r="5" fill="#247BFF" filter="url(#stack-node-glow)"/>
      <circle cx="600" cy="115" r="4.5" fill="#38BDF8"/>
    </g>

    <!-- Orbit 2 Satellites -->
    <g class="orbit-g-2">
      <circle cx="660" cy="55" r="6" fill="#60A5FA" filter="url(#stack-node-glow)"/>
      <circle cx="760" cy="115" r="4" fill="#00FFB2"/>
      <circle cx="660" cy="175" r="5" fill="#3B82F6"/>
    </g>

    <!-- Orbit 3 Satellites -->
    <g class="orbit-g-3">
      <circle cx="800" cy="115" r="6" fill="#FF354F" filter="url(#stack-node-glow)"/>
      <circle cx="520" cy="115" r="5" fill="#F43F5E"/>
    </g>

    <!-- Central Hub Badge -->
    <g class="core-pulse">
      <circle cx="660" cy="115" r="28" fill="#0C1428" stroke="#247BFF" stroke-width="2"/>
      <circle cx="660" cy="115" r="22" fill="#132242"/>
      <text x="660" y="119" fill="#F8FAFC" font-family="ui-sans-serif, system-ui" font-size="11" font-weight="800" text-anchor="middle">YM-STACK</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="44" y1="188" x2="806" y2="188" stroke="#1E293B" stroke-width="1"/>

  <!-- Grouped Tech Skill Chips (6 Categories) -->
  <g class="stack-font" transform="translate(44, 204)">
    <!-- Column 1: Languages & Frontend -->
    <g transform="translate(0, 0)">
      <!-- Languages -->
      <text x="0" y="14" fill="#60A5FA" font-size="12" font-weight="700">PROGRAMMING LANGUAGES</text>
      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="56" height="24" rx="5" fill="#131C31" stroke="#247BFF" stroke-width="1"/>
        <text x="28" y="16" fill="#E2E8F0" font-size="11" font-weight="600" text-anchor="middle">Java</text>

        <rect x="62" y="0" width="64" height="24" rx="5" fill="#131C31" stroke="#247BFF" stroke-width="1"/>
        <text x="94" y="16" fill="#E2E8F0" font-size="11" font-weight="600" text-anchor="middle">Python</text>

        <rect x="132" y="0" width="82" height="24" rx="5" fill="#131C31" stroke="#247BFF" stroke-width="1"/>
        <text x="173" y="16" fill="#E2E8F0" font-size="11" font-weight="600" text-anchor="middle">JavaScript</text>

        <rect x="220" y="0" width="50" height="24" rx="5" fill="#131C31" stroke="#247BFF" stroke-width="1"/>
        <text x="245" y="16" fill="#E2E8F0" font-size="11" font-weight="600" text-anchor="middle">SQL</text>

        <rect x="276" y="0" width="46" height="24" rx="5" fill="#131C31" stroke="#334155" stroke-width="1"/>
        <text x="299" y="16" fill="#94A3B8" font-size="11" font-weight="500" text-anchor="middle">C#</text>
      </g>

      <!-- Web Frontend -->
      <text x="0" y="74" fill="#38BDF8" font-size="12" font-weight="700">WEB DEVELOPMENT</text>
      <g transform="translate(0, 84)">
        <rect x="0" y="0" width="58" height="24" rx="5" fill="#131C31" stroke="#247BFF" stroke-width="1"/>
        <text x="29" y="16" fill="#E2E8F0" font-size="11" font-weight="600" text-anchor="middle">React</text>

        <rect x="64" y="0" width="86" height="24" rx="5" fill="#131C31" stroke="#247BFF" stroke-width="1"/>
        <text x="107" y="16" fill="#E2E8F0" font-size="11" font-weight="600" text-anchor="middle">TypeScript</text>

        <rect x="156" y="0" width="60" height="24" rx="5" fill="#131C31" stroke="#334155" stroke-width="1"/>
        <text x="186" y="16" fill="#CBD5E1" font-size="11" font-weight="500" text-anchor="middle">HTML5</text>

        <rect x="222" y="0" width="52" height="24" rx="5" fill="#131C31" stroke="#334155" stroke-width="1"/>
        <text x="248" y="16" fill="#CBD5E1" font-size="11" font-weight="500" text-anchor="middle">CSS3</text>

        <rect x="280" y="0" width="64" height="24" rx="5" fill="#131C31" stroke="#334155" stroke-width="1"/>
        <text x="312" y="16" fill="#CBD5E1" font-size="11" font-weight="500" text-anchor="middle">Tailwind</text>
      </g>

      <!-- Databases -->
      <text x="0" y="134" fill="#93C5FD" font-size="12" font-weight="700">DATABASES &amp; STORAGE</text>
      <g transform="translate(0, 144)">
        <rect x="0" y="0" width="62" height="24" rx="5" fill="#131C31" stroke="#247BFF" stroke-width="1"/>
        <text x="31" y="16" fill="#E2E8F0" font-size="11" font-weight="600" text-anchor="middle">MySQL</text>

        <rect x="68" y="0" width="76" height="24" rx="5" fill="#131C31" stroke="#334155" stroke-width="1"/>
        <text x="106" y="16" fill="#CBD5E1" font-size="11" font-weight="500" text-anchor="middle">MongoDB</text>

        <rect x="150" y="0" width="64" height="24" rx="5" fill="#131C31" stroke="#334155" stroke-width="1"/>
        <text x="182" y="16" fill="#CBD5E1" font-size="11" font-weight="500" text-anchor="middle">Oracle</text>
      </g>
    </g>

    <!-- Column 2: Backend, AI/ML, Cloud & Tools -->
    <g transform="translate(410, 0)">
      <!-- Backend -->
      <text x="0" y="14" fill="#34D399" font-size="12" font-weight="700">BACKEND &amp; APIS</text>
      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="94" height="24" rx="5" fill="#131C31" stroke="#10B981" stroke-width="1" stroke-opacity="0.6"/>
        <text x="47" y="16" fill="#D1FAE5" font-size="11" font-weight="600" text-anchor="middle">Spring Boot</text>

        <rect x="100" y="0" width="76" height="24" rx="5" fill="#131C31" stroke="#10B981" stroke-width="1" stroke-opacity="0.6"/>
        <text x="138" y="16" fill="#D1FAE5" font-size="11" font-weight="600" text-anchor="middle">REST APIs</text>

        <rect x="182" y="0" width="64" height="24" rx="5" fill="#131C31" stroke="#334155" stroke-width="1"/>
        <text x="214" y="16" fill="#CBD5E1" font-size="11" font-weight="500" text-anchor="middle">FastAPI</text>

        <rect x="252" y="0" width="52" height="24" rx="5" fill="#131C31" stroke="#334155" stroke-width="1"/>
        <text x="278" y="16" fill="#CBD5E1" font-size="11" font-weight="500" text-anchor="middle">Flask</text>

        <rect x="310" y="0" width="82" height="24" rx="5" fill="#131C31" stroke="#334155" stroke-width="1"/>
        <text x="351" y="16" fill="#94A3B8" font-size="10.5" font-weight="500" text-anchor="middle">ASP.NET Core</text>
      </g>

      <!-- AI / ML -->
      <text x="0" y="74" fill="#F87171" font-size="12" font-weight="700">AI / MACHINE LEARNING</text>
      <g transform="translate(0, 84)">
        <rect x="0" y="0" width="84" height="24" rx="5" fill="#24131A" stroke="#FF354F" stroke-width="1"/>
        <text x="42" y="16" fill="#FECDD3" font-size="11" font-weight="600" text-anchor="middle">TensorFlow</text>

        <rect x="90" y="0" width="84" height="24" rx="5" fill="#24131A" stroke="#FF354F" stroke-width="1"/>
        <text x="132" y="16" fill="#FECDD3" font-size="11" font-weight="600" text-anchor="middle">Scikit-learn</text>

        <rect x="180" y="0" width="76" height="24" rx="5" fill="#1C182B" stroke="#818CF8" stroke-width="1"/>
        <text x="218" y="16" fill="#E0E7FF" font-size="11" font-weight="500" text-anchor="middle">LangChain</text>

        <rect x="262" y="0" width="52" height="24" rx="5" fill="#1C182B" stroke="#818CF8" stroke-width="1"/>
        <text x="288" y="16" fill="#E0E7FF" font-size="11" font-weight="500" text-anchor="middle">RAG</text>

        <rect x="320" y="0" width="72" height="24" rx="5" fill="#131C31" stroke="#334155" stroke-width="1"/>
        <text x="356" y="16" fill="#CBD5E1" font-size="10.5" font-weight="500" text-anchor="middle">Pandas/NP</text>
      </g>

      <!-- Cloud & Tools -->
      <text x="0" y="134" fill="#A78BFA" font-size="12" font-weight="700">CLOUD &amp; TOOLING</text>
      <g transform="translate(0, 144)">
        <rect x="0" y="0" width="52" height="24" rx="5" fill="#131C31" stroke="#247BFF" stroke-width="1"/>
        <text x="26" y="16" fill="#E2E8F0" font-size="11" font-weight="600" text-anchor="middle">AWS</text>

        <rect x="58" y="0" width="46" height="24" rx="5" fill="#131C31" stroke="#247BFF" stroke-width="1"/>
        <text x="81" y="16" fill="#E2E8F0" font-size="11" font-weight="600" text-anchor="middle">Git</text>

        <rect x="110" y="0" width="64" height="24" rx="5" fill="#131C31" stroke="#247BFF" stroke-width="1"/>
        <text x="142" y="16" fill="#E2E8F0" font-size="11" font-weight="600" text-anchor="middle">GitHub</text>

        <rect x="180" y="0" width="54" height="24" rx="5" fill="#131C31" stroke="#334155" stroke-width="1"/>
        <text x="207" y="16" fill="#CBD5E1" font-size="11" font-weight="500" text-anchor="middle">Linux</text>

        <rect x="240" y="0" width="62" height="24" rx="5" fill="#131C31" stroke="#334155" stroke-width="1"/>
        <text x="271" y="16" fill="#CBD5E1" font-size="11" font-weight="500" text-anchor="middle">Docker</text>
      </g>
    </g>
  </g>
</svg>