<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B16"/>
      <stop offset="60%" stop-color="#0A1021"/>
      <stop offset="100%" stop-color="#0E162D"/>
    </linearGradient>
    <linearGradient id="hero-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247BFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF354F" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="hero-name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F5F7FB"/>
      <stop offset="80%" stop-color="#247BFF"/>
      <stop offset="100%" stop-color="#FF354F"/>
    </linearGradient>
    <linearGradient id="hero-role-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247BFF"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="hero-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#247BFF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FF354F" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#070B16" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hero-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#247BFF" fill-opacity="0.15"/>
    </pattern>
    <clipPath id="hero-avatar-clip">
      <circle cx="680" cy="180" r="105"/>
    </clipPath>
    <filter id="hero-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes hero-fade-in {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes hero-pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.04); }
    }
    @keyframes hero-ring-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes hero-role-cycle {
      0%, 20% { opacity: 1; transform: translateY(0); }
      25%, 95% { opacity: 0; transform: translateY(-16px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes hero-role-2 {
      0%, 20% { opacity: 0; transform: translateY(16px); }
      25%, 45% { opacity: 1; transform: translateY(0); }
      50%, 100% { opacity: 0; transform: translateY(-16px); }
    }
    @keyframes hero-role-3 {
      0%, 45% { opacity: 0; transform: translateY(16px); }
      50%, 70% { opacity: 1; transform: translateY(0); }
      75%, 100% { opacity: 0; transform: translateY(-16px); }
    }
    @keyframes hero-role-4 {
      0%, 70% { opacity: 0; transform: translateY(16px); }
      75%, 95% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(16px); }
    }
    @keyframes hero-live-pulse {
      0%, 100% { fill-opacity: 1; r: 4; }
      50% { fill-opacity: 0.4; r: 6; }
    }

    .hero-container { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .hero-text-shimmer { animation: hero-fade-in 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .hero-orbit-ring { transform-origin: 680px 180px; animation: hero-ring-spin 30s linear infinite; }
    .hero-pulse-glow { transform-origin: 680px 180px; animation: hero-pulse 4s ease-in-out infinite; }
    
    .role-text-1 { animation: hero-role-cycle 16s ease-in-out infinite; }
    .role-text-2 { animation: hero-role-2 16s ease-in-out infinite; }
    .role-text-3 { animation: hero-role-3 16s ease-in-out infinite; }
    .role-text-4 { animation: hero-role-4 16s ease-in-out infinite; }
    .live-dot { animation: hero-live-pulse 2s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .hero-orbit-ring, .hero-pulse-glow, .live-dot { animation: none !important; }
      .role-text-1 { opacity: 1 !important; transform: none !important; animation: none !important; }
      .role-text-2, .role-text-3, .role-text-4 { display: none !important; }
    }
  </style>

  <!-- Card Frame -->
  <rect x="2" y="2" width="846" height="356" rx="16" fill="url(#hero-bg)" stroke="url(#hero-border)" stroke-width="1.5"/>
  <rect x="2" y="2" width="846" height="356" rx="16" fill="url(#hero-dots)"/>

  <!-- Top Accent Horizon Line -->
  <path d="M 30 2 L 820 2" stroke="url(#hero-border)" stroke-width="2" stroke-linecap="round"/>

  <!-- Left Content Column -->
  <g class="hero-container" transform="translate(48, 45)">
    <!-- Status Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="280" height="26" rx="13" fill="#111B33" stroke="#247BFF" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="14" cy="13" r="4" fill="#00FFB2" class="live-dot"/>
      <text x="26" y="17" fill="#88E7D2" font-size="11" font-weight="600" letter-spacing="0.5">OPEN TO OPPORTUNITIES</text>
      <circle cx="168" cy="13" r="2" fill="#3B82F6"/>
      <text x="178" y="17" fill="#8E9BB5" font-size="11" font-weight="500">NIET B.Tech '27</text>
    </g>

    <!-- Animated Greeting -->
    <g transform="translate(0, 52)">
      <text x="0" y="0" fill="#8E9BB5" font-size="16" font-weight="500" letter-spacing="1">
        HI THERE, I'M <tspan fill="#247BFF" font-size="18">👋</tspan>
      </text>
      <!-- Big Name -->
      <text x="0" y="42" fill="url(#hero-name-grad)" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#hero-glow)">
        Yogendra Maurya
      </text>
    </g>

    <!-- Cycling Professional Roles (16s cycle) -->
    <g transform="translate(0, 138)">
      <text x="0" y="0" fill="#64748B" font-size="12" font-weight="600" letter-spacing="1.5">SPECIALIZING IN</text>
      
      <!-- Role 1 -->
      <g class="role-text-1">
        <text x="0" y="24" fill="#247BFF" font-size="20" font-weight="700">Software Developer</text>
        <text x="200" y="24" fill="#8E9BB5" font-size="14" font-weight="500">| Scalable Web &amp; Systems</text>
      </g>
      <!-- Role 2 -->
      <g class="role-text-2">
        <text x="0" y="24" fill="#60A5FA" font-size="20" font-weight="700">Backend Engineer</text>
        <text x="188" y="24" fill="#8E9BB5" font-size="14" font-weight="500">| Java • Spring Boot • REST APIs</text>
      </g>
      <!-- Role 3 -->
      <g class="role-text-3">
        <text x="0" y="24" fill="#FF354F" font-size="20" font-weight="700">AI / ML Enthusiast</text>
        <text x="180" y="24" fill="#8E9BB5" font-size="14" font-weight="500">| Python • TensorFlow • RAG</text>
      </g>
      <!-- Role 4 -->
      <g class="role-text-4">
        <text x="0" y="24" fill="#38BDF8" font-size="20" font-weight="700">Cloud &amp; DevOps Learner</text>
        <text x="238" y="24" fill="#8E9BB5" font-size="14" font-weight="500">| AWS • Docker • Linux</text>
      </g>
    </g>

    <!-- Concise Introduction -->
    <g transform="translate(0, 196)">
      <text x="0" y="0" fill="#CBD5E1" font-size="13.5" font-weight="400" line-height="20">
        CSE undergraduate focused on building practical, reliable software products,
      </text>
      <text x="0" y="20" fill="#94A3B8" font-size="13.5" font-weight="400">
        mastering modern backend architectures, and engineering intelligent ML solutions.
      </text>
    </g>

    <!-- Quick Tech Tags / Skills Pill Row -->
    <g transform="translate(0, 248)">
      <rect x="0" y="0" width="76" height="24" rx="6" fill="#141E33" stroke="#247BFF" stroke-width="1" stroke-opacity="0.3"/>
      <text x="38" y="16" fill="#93C5FD" font-size="11" font-weight="600" text-anchor="middle">Java &amp; Spring</text>

      <rect x="84" y="0" width="60" height="24" rx="6" fill="#141E33" stroke="#247BFF" stroke-width="1" stroke-opacity="0.3"/>
      <text x="114" y="16" fill="#93C5FD" font-size="11" font-weight="600" text-anchor="middle">Python</text>

      <rect x="152" y="0" width="98" height="24" rx="6" fill="#141E33" stroke="#247BFF" stroke-width="1" stroke-opacity="0.3"/>
      <text x="201" y="16" fill="#93C5FD" font-size="11" font-weight="600" text-anchor="middle">React &amp; TypeScript</text>

      <rect x="258" y="0" width="66" height="24" rx="6" fill="#141E33" stroke="#247BFF" stroke-width="1" stroke-opacity="0.3"/>
      <text x="291" y="16" fill="#93C5FD" font-size="11" font-weight="600" text-anchor="middle">MySQL</text>

      <rect x="332" y="0" width="82" height="24" rx="6" fill="#2A1420" stroke="#FF354F" stroke-width="1" stroke-opacity="0.3"/>
      <text x="373" y="16" fill="#FCA5A5" font-size="11" font-weight="600" text-anchor="middle">TensorFlow</text>

      <rect x="422" y="0" width="56" height="24" rx="6" fill="#141E33" stroke="#247BFF" stroke-width="1" stroke-opacity="0.3"/>
      <text x="450" y="16" fill="#93C5FD" font-size="11" font-weight="600" text-anchor="middle">AWS</text>
    </g>
  </g>

  <!-- Right Avatar & Orbital Showcase -->
  <g>
    <!-- Background Halo Glow -->
    <circle cx="680" cy="180" r="140" fill="url(#hero-halo)" class="hero-pulse-glow"/>

    <!-- Orbital Dash Rings -->
    <circle cx="680" cy="180" r="126" stroke="#247BFF" stroke-width="1" stroke-dasharray="8 12" stroke-opacity="0.4" fill="none" class="hero-orbit-ring"/>
    <circle cx="680" cy="180" r="115" stroke="#FF354F" stroke-width="1" stroke-dasharray="4 8" stroke-opacity="0.35" fill="none"/>

    <!-- Rotating Tech Nodes on Orbit -->
    <g class="hero-orbit-ring">
      <circle cx="680" cy="54" r="5" fill="#247BFF" filter="url(#hero-glow)"/>
      <circle cx="806" cy="180" r="4" fill="#FF354F"/>
      <circle cx="554" cy="180" r="4.5" fill="#60A5FA"/>
    </g>

    <!-- Avatar Hex/Circle Outer Ring -->
    <circle cx="680" cy="180" r="109" fill="#0A1020" stroke="#247BFF" stroke-width="2.5" stroke-opacity="0.8"/>
    
    <!-- Inlined Portrait Image -->
<image
  href="https://raw.githubusercontent.com/Yogendra630/Yogendra630/main/assets/id.png"
  x="575"
  y="75"
  width="210"
  height="210"
  clip-path="url(#hero-avatar-clip)"
  preserveAspectRatio="xMidYMid slice"
/>
    <!-- Tech HUD Accents around Avatar -->
    <rect x="635" y="296" width="90" height="20" rx="10" fill="#070B16" stroke="#247BFF" stroke-width="1"/>
    <text x="680" y="310" fill="#88E7D2" font-family="ui-sans-serif, system-ui" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">VERIFIED ID</text>
  </g>
</svg>
